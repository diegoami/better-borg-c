name: release
# Manual only: build, check and publish the downloadable assets for an
# existing release tag. Notes come from docs/releases/<tag>.md on main.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. 4.2.6-impact-v15'
        required: true
        type: string
      title:
        description: 'Release title (default: better-borg-c <tag>)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create the release as a draft'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      TITLE: ${{ inputs.title }}
      DRAFT: ${{ inputs.draft }}
      GH_TOKEN: ${{ github.token }}
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev xvfb xfonts-base
      - name: Check the tag, the notes and that no release exists yet
        run: |
          git rev-parse --verify "refs/tags/$TAG^{commit}"
          git fetch --no-tags origin main
          git show "origin/main:docs/releases/$TAG.md" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; not overwriting" >&2
            exit 1
          fi
      - name: Build the assets with the tag's own release tool
        run: python3 tools/make-release.py --ref "$TAG^{commit}" --version "$TAG" --out "$RUNNER_TEMP/out" --jobs 4
      - name: Check the patch reproduces the tag on its base
        run: |
          out="$RUNNER_TEMP/out"
          base=$(git show "$TAG^{commit}:patches/series.json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("upstream_import", {}).get("official_head", d["baseline"]))')
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          tar xzf "$out/better-borg-c-$TAG-patch.tar.gz" -C "$RUNNER_TEMP"
          sh "$RUNNER_TEMP/better-borg-c-$TAG-patch/apply.sh" "$RUNNER_TEMP/base"
          git -C "$RUNNER_TEMP/base" add -A
          git -C "$RUNNER_TEMP/base" diff --cached --exit-code "$TAG^{commit}" -- src lib CMakeLists.txt configure.ac Makefile.src
      - name: Check the source asset builds and passes the test gate
        run: |
          mkdir "$RUNNER_TEMP/src"
          tar xzf "$RUNNER_TEMP/out/better-borg-c-$TAG-src.tar.gz" -C "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src/better-borg-c-$TAG-src"
          cmake -S . -B build -DSUPPORT_BORG=ON -DSUPPORT_TEST_FRONTEND=ON -DSUPPORT_X11_FRONTEND=ON
          cmake --build build --parallel 4
          cmake --build build --target alltests --parallel 4 2>&1 | tee "$RUNNER_TEMP/alltests.log"
          python3 - "$RUNNER_TEMP/alltests.log" <<'EOF'
          import re, sys
          text = re.sub(r'\x1b\[[0-9;]*m', '', open(sys.argv[1]).read())
          totals = [(int(a), int(b)) for a, b in re.findall(r'^Total:[ \t]+(\d+)/(\d+)', text, re.M)]
          print('totals', totals)
          assert len(totals) == 2 and all(p == n for p, n in totals), totals
          assert totals[0][1] >= 965 and totals[1][1] >= 5, totals
          EOF
      - name: Check the Linux binary starts under Xvfb
        run: |
          mkdir "$RUNNER_TEMP/bin"
          tar xzf "$RUNNER_TEMP/out/better-borg-c-$TAG-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin/better-borg-c-$TAG-linux-x86_64"
          set +e
          xvfb-run -a timeout 10 ./play.sh -n > "$RUNNER_TEMP/smoke.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/smoke.log"
          # 124: still running at the timeout, i.e. it started and waited for input.
          test "$rc" = 124
      - name: Add build facts to the notes
        run: |
          out="$RUNNER_TEMP/out"
          glibc=$(objdump -T "$out/work/better-borg-c-$TAG-linux-x86_64/angband" | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -1)
          {
            echo
            echo "## Build facts"
            echo
            echo "- Built by the \`release\` workflow, run ${GITHUB_RUN_ID}, on \`$(lsb_release -ds)\`, from tag \`$TAG\` (commit \`$(git rev-parse "$TAG^{commit}")\`)."
            echo "- The Linux binary needs ${glibc#GLIBC_} or newer (glibc) and X11 bitmap fonts."
            echo "- Workflow checks: the patch reproduces the tag on its base; the source asset passes its unit and front-end tests; the binary starts under Xvfb."
            echo
            echo '```'
            cat "$out/SHA256SUMS"
            echo '```'
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Keep the assets as a workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: |
            ${{ runner.temp }}/out/*.tar.gz
            ${{ runner.temp }}/out/SHA256SUMS
            ${{ runner.temp }}/notes.md
      - name: Publish the release
        run: |
          out="$RUNNER_TEMP/out"
          title="${TITLE:-better-borg-c $TAG}"
          draft=()
          if [ "$DRAFT" = "true" ]; then draft=(--draft); fi
          gh release create "$TAG" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${draft[@]}" \
            "$out/better-borg-c-$TAG-linux-x86_64.tar.gz" \
            "$out/better-borg-c-$TAG-src.tar.gz" \
            "$out/better-borg-c-$TAG-patch.tar.gz" \
            "$out/SHA256SUMS"
