name: native C verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev perl util-linux
      - name: Verification tooling controls
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Native Borg build and numerical test gate
        run: python3 tools/verify-native.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-verification
          path: artifacts/native/
